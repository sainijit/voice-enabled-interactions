# Kiosk-pinned config for the text-to-speech service.
#
# This file is mounted into the text-to-speech container by
# voice-enabled-interactions/smart-kiosk-assistant/docker-compose.yml,
# replacing the service config so the kiosk always boots a known-good
# version regardless of changes in edge-ai-libraries.
app:
  name: Text To Speech
  clear_storage_on_startup: true  # true | false — delete all session folders under storage/ at startup

models:
  tts:
    # Model id. Permitted values:
    #   SpeechT5: microsoft/speecht5_tts
    #   Qwen:     Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
    name: microsoft/speecht5_tts
    # Inference runtime backend. Permitted values: openvino | pytorch
    runtime: openvino
    # Inference device. Permitted values: CPU | GPU
    #   SpeechT5: CPU or GPU
    #   Qwen:     CPU or GPU
    #
    # Tried GPU to free CPU headroom for a bigger Whisper model during
    # noisy-demo tuning — reverted immediately. Measured with dtype=int8 on
    # this GPU: first call 281s(!), steady-state 8.7-8.8s per synthesis, vs
    # 0.92-0.95s on CPU. The existing comment below ("GPU fp16 works great
    # post-warmup") only covers fp16 — int8 on this iGPU is catastrophically
    # slow (likely falling back to software/emulated int8 ops or fighting
    # ovms-llm for GPU bandwidth), not the "int4 produces noise" issue that
    # was already flagged. Do not move TTS to GPU with int8; if GPU is
    # revisited, it must be re-benchmarked with dtype=fp16 first.
    device: CPU
    # Model precision. Permitted values: int8 | int4 | fp16 | fp32
    # NOTE: int4 on iGPU produces noise; GPU fp16 works great post-warmup
    dtype: int8
    # Model variant. Permitted values:
    #   SpeechT5: default
    #   Qwen:     custom_voice | voice_design
    model_variant: custom_voice
    # Default speaker/voice. Permitted values:
    #   SpeechT5: Ryan | Miles | Aaron | Nora | Elena | Kabir | Angus
    #             (CMU Arctic ids bdl/jmk/rms/clb/slt/ksp/awb are accepted as aliases)
    #   Qwen custom_voice example: Ryan
    #   Qwen voice_design: speaker can be omitted
    #
    # Ryan (CMU Arctic "bdl", US male) is the kiosk default: measured ~3.8 dB
    # louder and ~13% faster to synthesize than the previous implicit voice
    # ("Elena"/slt), which sounded feeble over kiosk speakers.
    default_speaker: Ryan
    # Default language. Permitted values: English (the service currently supports English only)
    default_language: English
    models_base_path: models           # directory for downloaded/exported model assets
    use_local_cache: true              # true | false — reuse locally cached/exported models

audio:
  output_format: wav                   # output audio format. Permitted values: wav
  sample_width: 16                     # output sample width in bits. Permitted values: 16

pipeline:
  persist_outputs: true                # true | false — write synthesized audio + metadata to storage/<session_id>/
