# Agent configuration — generic defaults
#
# Kiosk-specific identity (name, description) is loaded at runtime from
# configs/rag-service/agent_profile.yaml via domain_config.  These values
# are used only when RAG_DOMAIN_CONFIG_PATH is not set.

agent:
  name: rag_agent
  description: "RAG-powered AI assistant"
  # OVMS model (overridden by AGENT_LLM_MODEL env var)
  model: Qwen3-4B
  # Generation parameters passed to LiteLlm
  temperature: 0.2
  max_output_tokens: 512
  # Session TTL in seconds (overridden by AGENT_SESSION_TTL)
  session_ttl: 3600

observability:
  # INFO shows high-level events (intent, tool selected, order id)
  # DEBUG shows full prompts and tool args/results
  log_level: INFO
